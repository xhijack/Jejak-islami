<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jejak Sirah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Instrument+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: meja pasir 3D di kiri, panel detail di kanan, timeline di bawah peta. Satu tampilan gelap: lapis lazuli + emas seperti iluminasi mushaf. */
:root {
  color-scheme: dark;
  --lapis-0: #0b1430; --lapis-1: #121e45; --lapis-2: #1b2b5e; --lapis-3: #26397a;
  --gold: #d4ae5a; --gold-soft: #ecd8a2; --green: #1d4a39;
  --ink: #ece4d2; --muted: #a7aec6; --line: rgba(212, 174, 90, .28);
  --sand: #d9bf8f; --sand-deep: #a9865a; --rock: #6b5242;
  --f-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-text: "Literata", Georgia, "Times New Roman", serif;
  --f-ar: "Amiri", "Traditional Arabic", "Noto Naskh Arabic", serif;
  --f-quran: "Amiri Quran", "Amiri", "Traditional Arabic", serif;
}
html, body, #root { height: 100%; }
body { margin: 0; background: var(--lapis-0); color: var(--ink); font: 14px/1.5 var(--f-ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }

.app {
  height: 100%; box-sizing: border-box; display: grid; gap: 12px;
  grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto minmax(0, 1fr) auto;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(120% 80% at 30% 0%, var(--lapis-1), var(--lapis-0) 70%);
}
/* Kepala: nama, navigasi utama, catatan draf */
.top { grid-column: 1 / -1; display: flex; align-items: stretch; gap: 28px; padding-bottom: 0; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; justify-content: center; padding-bottom: 10px; min-width: 0; }
.brand h1 { margin: 0; font: 600 25px/1.1 var(--f-text); color: var(--gold-soft); letter-spacing: .01em; white-space: nowrap; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.nav { display: flex; gap: 2px; align-items: stretch; min-width: 0; }
.nav button { display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 6px 16px 10px; border: 0; border-bottom: 3px solid transparent;
  background: none; cursor: pointer; text-align: left; color: var(--muted); border-radius: 8px 8px 0 0; }
.nav button b { font: 600 15px/1.2 var(--f-ui); color: var(--ink); }
.nav button small { font-size: 11.5px; line-height: 1.25; white-space: nowrap; }
.nav button:hover { background: rgba(212, 174, 90, .08); }
.nav button.on { border-bottom-color: var(--gold); background: linear-gradient(180deg, transparent, rgba(212, 174, 90, .12)); }
.nav button.on b { color: var(--gold-soft); }
.top-end { margin-left: auto; align-self: center; display: flex; gap: 8px; align-items: center; padding-bottom: 8px; }
.draft-note { padding-bottom: 0; }
.about-btn { height: 28px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--lapis-2); color: var(--ink); cursor: pointer; font-size: 12.5px; font-weight: 600; }
.about-btn:hover { border-color: var(--gold); }
.about { width: min(680px, 100%); }
.about h2 { margin: 0 40px 8px 0; font: 600 26px/1.2 var(--f-text); color: var(--gold-soft); }
.about-tabs { padding: 0; margin-bottom: 14px; }
.about-body h3 { margin: 18px 0 8px; font: 600 14px/1.3 var(--f-ui); color: var(--gold); }
.about-body p { font: 15px/1.6 var(--f-text); }
.about-body .dim, .about .dim { color: var(--muted); font-size: 13.5px; }
.author { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--lapis-2); border: 1px solid var(--line); }
.author .ph-k { margin: 0; font: 12px/1.3 var(--f-ui); }
.author b { display: block; font: 600 18px/1.3 var(--f-text); color: var(--gold-soft); }
.author a { color: var(--gold-soft); font-size: 14px; text-underline-offset: 3px; }
.about-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5; }
.about-list b { color: var(--ink); margin-right: 4px; }
.about-list a { color: var(--gold-soft); text-underline-offset: 3px; }
.src-group { margin: 0 0 12px; }
.src-group > p { margin: 0 0 6px !important; font: 14px/1.4 var(--f-ui) !important; }
.src-group > p span { color: var(--muted); font-size: 12.5px; margin-left: 6px; }
.src-nums { display: flex; flex-wrap: wrap; gap: 4px; }
.src-nums a { min-width: 34px; padding: 3px 7px; box-sizing: border-box; text-align: center; border-radius: 6px; background: var(--lapis-2); border: 1px solid rgba(212, 174, 90, .18); color: var(--gold-soft); font-size: 12.5px; text-decoration: none; font-variant-numeric: tabular-nums; }
.src-nums a:hover { border-color: var(--gold); }
.src-links { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.src-links a { color: var(--gold-soft); text-underline-offset: 3px; text-decoration-color: var(--line); }
.draft-note .badge { cursor: pointer; background: none; }
.draft-note .badge:hover { border-color: var(--gold); }
.badge { border: 1px solid var(--line); color: var(--gold); border-radius: 99px; padding: 3px 10px; font-size: 12px; white-space: nowrap; }

/* Peta */
.map { grid-column: 1; grid-row: 2; position: relative; min-height: 320px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(90% 70% at 50% 40%, #1a2a5c, var(--lapis-0)); }
.map-canvas { position: absolute; inset: 0; cursor: grab; }
.map-canvas:active { cursor: grabbing; }
.map-canvas canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.map-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pin { position: absolute; left: 0; top: 0; width: 0; height: 0; visibility: hidden; }
.pin-wrap { position: absolute; left: 0; bottom: 0; transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; pointer-events: auto; }
.pin-btn { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; cursor: pointer; border-radius: 6px; padding: 2px 7px;
  background: rgba(11, 20, 48, .72); border: 1px solid rgba(236, 216, 162, .18); color: var(--muted); font-size: 11.5px; }
.pin-ar { font-family: var(--f-ar); font-size: 13px; color: var(--gold); opacity: .7; }
.pin.is-active .pin-btn { color: var(--ink); border-color: var(--gold); background: rgba(18, 30, 69, .9); font-size: 13px; font-weight: 600; }
.pin.is-active .pin-ar { opacity: 1; }
.pin.is-sel .pin-btn { background: var(--gold); color: var(--lapis-0); }
.pin.is-sel .pin-ar { color: var(--lapis-0); }
.pin-btn:hover { border-color: var(--gold-soft); color: var(--ink); }
.pin-medals { display: flex; gap: 3px; align-items: center; }
.more { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--lapis-1); font-size: 10px; cursor: pointer; }
/* Kontrol peta: satu baris di kanan bawah */
.map-tools { position: absolute; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; align-items: flex-end; gap: 8px; max-width: calc(100% - 24px); z-index: 1; }
.tool-group { display: flex; border-radius: 10px; border: 1px solid var(--line); background: rgba(13, 22, 52, .9); overflow: hidden; }
.tool-group .tool { border: 0; border-radius: 0; background: none; }
.tool-group .tool + .tool { border-left: 1px solid rgba(212, 174, 90, .18); }
.tool { height: 36px; min-width: 36px; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: rgba(13, 22, 52, .9); cursor: pointer; font-size: 17px; line-height: 1; color: var(--ink); }
.tool:hover { background: var(--lapis-2); }
.tool.wide { padding: 0 12px; font: 600 13px/1 var(--f-ui); }
.tool.primary { background: var(--gold); border-color: var(--gold); color: var(--lapis-0); }
.tool.primary:hover { background: var(--gold-soft); }
.panpad { display: grid; grid-template-columns: repeat(3, 24px); grid-template-rows: repeat(2, 18px); padding: 2px; gap: 1px; }
.panpad button { width: 24px; height: 18px; border: 0; border-radius: 4px; background: none; font-size: 9px; padding: 0; cursor: pointer; color: var(--ink); touch-action: none; user-select: none; }
.panpad button:hover { background: var(--lapis-2); }
.panpad button:active { background: var(--gold); color: var(--lapis-0); }
.panpad .u { grid-column: 2; grid-row: 1; } .panpad .l { grid-column: 1; grid-row: 1 / 3; height: auto; } .panpad .r { grid-column: 3; grid-row: 1 / 3; height: auto; } .panpad .d { grid-column: 2; grid-row: 2; }
.pop { position: relative; }
.pop-box { position: absolute; right: 0; z-index: 50; width: 300px; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--gold);
  background: var(--lapis-1); box-shadow: 0 16px 40px rgba(0, 0, 0, .45); font-size: 13px; }
.pop.up .pop-box { bottom: calc(100% + 8px); }
.pop-box.down { top: calc(100% + 8px); }
.pop-box p { margin: 0 0 8px; line-height: 1.5; } .pop-box p:last-child { margin: 0; }
.help-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.help-list li { display: grid; grid-template-columns: 1fr; gap: 0; }
.help-list b { color: var(--gold-soft); font-weight: 600; } .help-list span { color: var(--muted); }
.set-row { display: flex; gap: 12px; align-items: center; }
.set-row span { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.set-row small { color: var(--muted); line-height: 1.4; }
.switch { flex: none; height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--lapis-2); cursor: pointer; font-weight: 600; }
.switch.on { background: var(--gold); color: var(--lapis-0); border-color: var(--gold); }
.set-stat { margin: 10px 0 0 !important; font-size: 12px; color: var(--muted); }

/* Medali nama */
.medal { display: inline-grid; place-items: center; flex: none; padding: 0; border-radius: 50%; color: var(--gold-soft);
  background: radial-gradient(circle at 35% 30%, var(--lapis-3), var(--lapis-1)); border: 1.5px solid var(--gold);
  box-shadow: inset 0 0 0 2px var(--lapis-1), inset 0 0 0 3px rgba(212, 174, 90, .45); }
button.medal { cursor: pointer; }
button.medal:hover { transform: scale(1.08); }
.medal-nabi { background: radial-gradient(circle at 35% 30%, #2d6a52, var(--green)); }
.medal-ar { font-family: var(--f-ar); font-weight: 700; line-height: 1; text-align: center; max-width: 84%; overflow: hidden; }
.medal-xs { width: 22px; height: 22px; } .medal-xs .medal-ar { font-size: 8px; }
.medal-sm { width: 30px; height: 30px; } .medal-sm .medal-ar { font-size: 10px; }
.medal-md { width: 44px; height: 44px; } .medal-md .medal-ar { font-size: 14px; }
.medal-lg { width: 92px; height: 92px; border-width: 2px; } .medal-lg .medal-ar { font-size: 24px; }

/* Timeline */
.timeline { grid-column: 1; grid-row: 3; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center;
  background: var(--lapis-1); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.tl-now { display: flex; align-items: center; gap: 12px; min-width: 200px; }
.tl-year { font: 600 40px/1 var(--f-text); color: var(--gold-soft); font-variant-numeric: tabular-nums; }
.tl-m { font-size: 13px; color: var(--muted); margin-left: 3px; }
.tl-meta { display: flex; flex-direction: column; font-size: 12.5px; line-height: 1.3; }
.tl-meta b { color: var(--ink); } .tl-meta span { color: var(--muted); }
.tl-track { position: relative; min-width: 0; }
.eras { position: relative; height: 22px; }
.era { position: absolute; top: 0; height: 20px; box-sizing: border-box; border: 0; border-right: 2px solid var(--lapis-1); background: var(--lapis-2);
  color: var(--muted); font-size: 10.5px; cursor: pointer; overflow: hidden; padding: 0 4px; }
.era span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.era:hover { background: var(--lapis-3); color: var(--ink); }
.era.on { background: var(--gold); color: var(--lapis-0); font-weight: 600; }
.ticks { position: relative; height: 10px; margin-top: 4px; }
.ticks i { position: absolute; top: 0; width: 2px; height: 8px; margin-left: -1px; background: var(--gold); opacity: .45; }
.ticks i.on { opacity: 1; height: 10px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--lapis-3), var(--gold)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--lapis-3), var(--gold)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; transform: rotate(45deg); border-radius: 3px; background: var(--gold-soft); border: 2px solid var(--lapis-0); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; transform: rotate(45deg); border-radius: 3px; background: var(--gold-soft); border: 2px solid var(--lapis-0); }
.scale { position: relative; height: 28px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scale span { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.scale span:first-child { transform: none; align-items: flex-start; }
.scale span:last-child { transform: translateX(-100%); align-items: flex-end; }
.scale em { font-style: normal; font-size: 10px; opacity: .8; }
.tl-ctl { display: flex; gap: 6px; }
.tl-ctl button { height: 36px; min-width: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--lapis-2); cursor: pointer; font-size: 18px; }
.tl-ctl .play { padding: 0 14px; font-size: 13px; font-weight: 600; background: var(--gold); color: var(--lapis-0); border-color: var(--gold); }
.tl-ctl button:hover { border-color: var(--gold-soft); }

/* Panel */
.panel { grid-column: 2; grid-row: 2 / -1; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  background: var(--lapis-1); border: 1px solid var(--line); border-radius: 14px; }
.loc-head { padding: 0 0 12px; border-bottom: 1px solid var(--line); }
.loc-head.plain { padding: 18px 18px 12px; }
.loc-head.plain h2 { margin: 0; font: 600 24px/1.2 var(--f-text); color: var(--gold-soft); }
.vignette { display: block; width: 100%; height: 108px; object-fit: cover; }
.ph-k { margin: 0 0 2px; font-size: 12px; color: var(--muted); }
.more-info { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.more-info summary { cursor: pointer; color: var(--gold); width: max-content; }
.more-info p { margin: 6px 0 0; line-height: 1.55; }
.ph-back { display: inline-block; margin: 10px 18px 0; }
.loc-head.plain .ph-back { margin: 0 0 6px; }
.loc-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 18px 0; }
.loc-title h2 { margin: 0; font: 600 24px/1.2 var(--f-text); color: var(--gold-soft); text-wrap: balance; }
.loc-ar { font: 700 24px/1 var(--f-ar); color: var(--gold); }
.loc-ket { margin: 6px 18px 0; color: var(--muted); font-size: 13px; }
.loc-head.plain .loc-ket { margin: 6px 0 0; }
.tabs { display: flex; gap: 4px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 8px 10px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; }
.tabs button[aria-selected=true] { color: var(--gold-soft); border-bottom-color: var(--gold); }
.panel-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; }
.event { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid rgba(212, 174, 90, .14); }
.event:last-child { border-bottom: 0; }
.event header { display: flex; flex-direction: column; gap: 2px; }
.event-when { margin: 0; font-size: 12px; color: var(--muted); }
.event-when b { color: var(--gold); font-variant-numeric: tabular-nums; }
.event h3 { margin: 0; font: 600 18px/1.3 var(--f-text); color: var(--ink); text-wrap: balance; }
.link { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.link:hover { color: var(--gold-soft); }
.narasi { margin: 0; font: 15px/1.65 var(--f-text); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 2px; border-radius: 99px; border: 1px solid var(--line); background: var(--lapis-2); cursor: pointer; font-size: 12.5px; }
.chip:hover { border-color: var(--gold); }
.ayat { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: linear-gradient(180deg, rgba(212, 174, 90, .07), transparent 60%); }
.ayat p { margin: 0; }
.ayat-ref { font-size: 12px; font-weight: 600; color: var(--gold); }
.ayat-ar { font: 22px/2 var(--f-quran); color: var(--gold-soft); margin: 6px 0 8px !important; text-align: right; }
.ayat-label { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin-bottom: 2px !important; }
.ayat p:not([class]) { font: 14px/1.6 var(--f-text); }
.src { font-size: 12px; color: var(--gold); margin-top: 6px !important; }
.note { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px !important; }
.foot p { margin: 0; }
.empty p { margin: 0 0 10px; color: var(--muted); }
.jump { display: flex; flex-direction: column; gap: 8px; }
.jump button { text-align: left; border: 1px solid var(--line); border-radius: 10px; background: var(--lapis-2); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; font-weight: 500; }
.jump small { color: var(--gold); font-size: 11.5px; }
.jump button:hover { border-color: var(--gold); }
.people { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; }
.people button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid transparent; border-radius: 10px; background: none; padding: 6px; cursor: pointer; }
.people button:hover { background: var(--lapis-2); }
.people button.here { border-color: var(--line); background: var(--lapis-2); }
.people span { display: flex; flex-direction: column; min-width: 0; }
.people b { font-weight: 600; font-size: 13px; }
.people small { color: var(--muted); font-size: 11.5px; }
.draft { margin: 0; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }

/* Profil */
.overlay { position: fixed; inset: 0; z-index: 210000; display: grid; place-items: center; background: rgba(5, 9, 24, .7);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.profile { position: relative; width: min(540px, 100%); max-height: 86vh; overflow: auto; box-sizing: border-box; padding: 24px;
  background: var(--lapis-1); border: 1px solid var(--gold); border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); }
.profile p { margin: 0 0 10px; font: 15px/1.6 var(--f-text); }
.profile-head { display: flex; gap: 18px; align-items: center; margin-bottom: 14px; }
.profile h2 { margin: 0; font: 600 24px/1.2 var(--f-text); color: var(--gold-soft); }
.profile .gelar { margin: 2px 0 0; font: 13px/1.4 var(--f-ui); color: var(--ink); }
.profile .years { margin: 2px 0 0; font: 12.5px/1.4 var(--f-ui); color: var(--gold); font-variant-numeric: tabular-nums; }
.profile .status { font: 500 13px/1.4 var(--f-ui); color: var(--gold-soft); background: var(--lapis-2); border-radius: 8px; padding: 6px 10px; display: inline-block; }
.profile h3 { margin: 16px 0 8px; font: 600 14px/1.3 var(--f-ui); color: var(--muted); }
.close { position: absolute; top: 10px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--lapis-2); cursor: pointer; font-size: 18px; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.plist button { width: 100%; display: flex; gap: 12px; align-items: baseline; text-align: left; border: 0; border-radius: 8px; background: none; padding: 6px 8px; cursor: pointer; }
.plist button:hover { background: var(--lapis-2); }
.plist .py { color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 600; min-width: 34px; }
.plist span:last-child { display: flex; flex-direction: column; }
.plist small { color: var(--muted); }

/* Mode kota */
:root { --k-pasti: #d9b45a; --k-kitab: #6cc4ae; --k-perkiraan: #d08f7c; }
.enter-city { margin: 12px 18px 0; width: calc(100% - 36px); box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; text-align: left;
  padding: 10px 14px; border-radius: 10px; border: 1px solid var(--gold); background: var(--gold); color: var(--lapis-0); cursor: pointer; }
.enter-city span { font-size: 12px; opacity: .85; }
.enter-city:hover { background: var(--gold-soft); }
.map.city { background: radial-gradient(90% 70% at 50% 40%, #2a2340, #120f22); }
.kdot { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--kc, var(--gold)); }
.k-pasti { --kc: var(--k-pasti); } .k-kitab { --kc: var(--k-kitab); } .k-perkiraan { --kc: var(--k-perkiraan); }
.k-perkiraan .kdot { background: transparent; border: 2px dashed var(--kc); width: 7px; height: 7px; }
.city .pin-btn { align-items: center; border-color: color-mix(in srgb, var(--kc) 45%, transparent); }
.city .pin.is-active .pin-btn { border-color: var(--kc); }
.city .pin.is-sel .pin-btn { background: var(--kc); color: var(--lapis-0); }
.city .pin.is-sel .kdot { background: var(--lapis-0); border-color: var(--lapis-0); }
.city .pin.j-gunung .pin-btn { background: none; border: 0; color: var(--sand); font-style: italic; font-size: 12px; text-shadow: 0 1px 3px #000; }
.city .pin.j-gunung .kdot { display: none; }
.city .pin.j-kawasan .pin-btn { background: rgba(11, 20, 48, .5); border-style: dashed; }
.city-top { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; z-index: 1; }
.city-top .back { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--gold); background: var(--gold); color: var(--lapis-0); font-weight: 600; cursor: pointer; }
.city-top .back kbd { font: 600 11px/1 var(--f-ui); padding: 2px 5px; margin-left: 6px; border-radius: 4px; background: rgba(11, 20, 48, .2); }
.city-title { display: flex; flex-direction: column; line-height: 1.2; padding: 6px 12px; border-radius: 10px; background: rgba(11, 20, 48, .82); border: 1px solid var(--line); }
.city-top .legend { padding: 6px 10px; }
.walk-keys { position: absolute; left: 12px; bottom: 12px; margin: 0; padding: 6px 10px; border-radius: 10px; background: rgba(11, 20, 48, .78); border: 1px solid var(--line); font-size: 12px; color: var(--ink); }
.city-title b { font: 600 18px/1.2 var(--f-text); color: var(--gold-soft); }
.city-title span { font-size: 12px; color: var(--muted); }
.city-foot { position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; pointer-events: none; }
.city-foot > * { pointer-events: auto; }
.legend { margin: 0; padding: 8px 10px; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px;
  background: rgba(11, 20, 48, .78); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
.city-foot .hint { flex: 1 1 260px; margin: 0; font-size: 11.5px; color: var(--ink); text-shadow: 0 1px 3px #000; min-width: 0; }
.city-foot .stat { margin: 0 0 0 auto; padding: 4px 10px; border-radius: 99px; font-size: 11.5px; background: rgba(11, 20, 48, .78); border: 1px solid var(--line); color: var(--gold-soft); font-variant-numeric: tabular-nums; }
.walking .city-foot { bottom: 10px; right: 150px; }
.city-foot .qbtn { cursor: pointer; font: inherit; font-size: 11.5px; margin-left: auto; }
.city-foot .qbtn + .stat { margin-left: 0; }
.city-foot .qbtn:hover { border-color: var(--gold); }
.city .pin.j-jalan .pin-btn { background: rgba(60, 40, 20, .55); border: 0; border-radius: 4px; color: var(--sand); font-size: 11.5px; letter-spacing: .02em; }
.city .pin.j-jalan .kdot { display: none; }
.city .pin.j-jalan.is-sel .pin-btn { background: var(--kc); color: var(--lapis-0); }
.map.city.walking { background: linear-gradient(180deg, #24305e 0%, #6d5a7e 38%, #c3906f 62%, #b88a6c 100%); }
.map-tools .walk-btn { background: var(--gold); color: var(--lapis-0); border-color: var(--gold); font-weight: 600; }
.map-tools .walk-btn:hover { background: var(--gold-soft); }
.walk-hud { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: calc(100% - 340px); }
.kabah-dir { margin: 0; padding: 4px 12px; border-radius: 99px; background: rgba(11, 20, 48, .8); border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
.near { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-radius: 10px; cursor: pointer; border: 1px solid var(--gold); background: rgba(18, 30, 69, .92); text-align: left; }
.near em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--lapis-0); background: var(--gold); border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
.near:hover em { background: var(--gold-soft); }
.dpad { position: absolute; right: 14px; bottom: 14px; display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(2, 40px); gap: 4px; }
.dpad button { border-radius: 8px; border: 1px solid var(--line); background: rgba(18, 30, 69, .88); cursor: pointer; font-size: 15px; touch-action: none; user-select: none; }
.dpad button:active { background: var(--gold); color: var(--lapis-0); }
.dpad .u { grid-column: 2; grid-row: 1; } .dpad .l { grid-column: 1; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 2; } .dpad .r { grid-column: 3; grid-row: 2; }
.walk-here { margin-top: 10px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--gold); background: var(--gold); color: var(--lapis-0); font-weight: 600; cursor: pointer; align-self: flex-start; }
.loc-head.plain .walk-here { display: inline-block; }
.walk-here:hover { background: var(--gold-soft); }
.legend li { display: flex; align-items: center; gap: 6px; cursor: help; }
.loc-title.flush { padding: 8px 0 0; }
.link.small { font-size: 12.5px; color: var(--gold); text-decoration: none; }
.kbadge { display: block; margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; color: var(--ink);
  background: color-mix(in srgb, var(--kc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--kc) 40%, transparent); }
.kbadge .kdot { margin-right: 6px; transform: translateY(1px); }
.riwayat { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(212, 174, 90, .16); }
.riwayat.now { border-color: var(--gold); background: linear-gradient(180deg, rgba(212, 174, 90, .1), transparent 70%); }
.riwayat h3 { margin: 0; font: 600 17px/1.3 var(--f-text); text-wrap: balance; }
.riwayat .event-when { display: flex; gap: 8px; align-items: center; }
.tag-now { font-size: 11px; font-weight: 600; color: var(--lapis-0); background: var(--gold); border-radius: 99px; padding: 1px 8px; }
.matan { margin: 0; font: 20px/1.9 var(--f-ar); color: var(--gold-soft); text-align: right; }
.src-line { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; font-size: 12.5px; }
.src-line a, .srcs a { color: var(--gold-soft); text-underline-offset: 3px; text-decoration-color: var(--line); }
.src-line span:not(.deg) { color: var(--gold); }
.deg { font-size: 11px; font-weight: 600; border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
.d-shahih { background: #2d6a52; color: #e4f4ec; } .d-sirah { background: var(--lapis-3); color: var(--ink); } .d-lemah { background: #7a3b34; color: #f6e1dd; }
.chip.go { padding: 4px 12px; color: var(--gold-soft); }
.sec { margin: 0 0 6px; font: 600 13px/1.3 var(--f-ui); color: var(--muted); }
.plist2 { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.prow { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; border: 0; border-radius: 8px; background: none; padding: 7px 8px; cursor: pointer; }
.prow:hover { background: var(--lapis-2); }
.prow span { display: flex; flex-direction: column; }
.prow b { font-weight: 600; } .prow small { color: var(--muted); font-size: 11.5px; }
.unmapped { display: flex; flex-direction: column; gap: 8px; }
.unmapped > p { margin: 0; color: var(--muted); font-size: 13px; }
.unmapped > p b { color: var(--ink); }
.srcs { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.empty-p { color: var(--muted); margin: 0; }

/* Tontonan peristiwa */
.watch { align-self: flex-start; display: inline-flex; gap: 8px; align-items: center; padding: 6px 14px; border-radius: 99px; border: 1px solid var(--gold); background: var(--gold); color: var(--lapis-0); font-weight: 600; cursor: pointer; }
.watch:hover { background: var(--gold-soft); }
.pl-overlay { position: fixed; inset: 0; z-index: 200000; background: rgba(4, 7, 20, .92); display: grid; place-items: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.pl-wrap { width: min(1280px, 100%, calc((100vh - 230px) * 16 / 9)); min-width: min(100%, 560px); display: flex; flex-direction: column; gap: 10px; }
.pl-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.pl-head h2 { margin: 0; font: 600 24px/1.2 var(--f-text); color: var(--gold-soft); }
.pl-kicker { margin: 0; font-size: 12.5px; color: var(--muted); }
.pl-head .close { position: static; flex: none; }
.pl-stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #060b20; }
.pl-stage svg { display: block; width: 100%; height: 100%; }
.pl-scene { animation: plFade .9s ease both; }
@keyframes plFade { from { opacity: 0; } to { opacity: 1; } }
.pl-stars circle { animation: plTw 3.2s ease-in-out infinite alternate; }
@keyframes plTw { from { opacity: .25; } }
.pl-dawn { animation: plDawn 6s ease-in-out infinite alternate; transform-origin: 820px 800px; }
@keyframes plDawn { from { opacity: .6; transform: scale(.92); } to { opacity: 1; transform: scale(1.05); } }
.pl-flicker { animation: plFl 1.7s ease-in-out infinite alternate; }
@keyframes plFl { 0% { opacity: .75; } 40% { opacity: 1; } 70% { opacity: .82; } 100% { opacity: .95; } }
.pl-flame { animation: plFl .5s ease-in-out infinite alternate; }
.pl-halo { animation: plGlow 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.pl-halo.on { animation-duration: 1.2s; }
@keyframes plGlow { from { opacity: .7; transform: scale(.94); } to { opacity: 1; transform: scale(1.06); } }
.pl-r-ar { font: 700 44px/1 var(--f-ar); fill: #fff6d8; }
.pl-r-id { font: 600 30px/1 var(--f-text); fill: #fff1c4; letter-spacing: .02em; }
.pl-name { filter: drop-shadow(0 1px 2px rgba(60, 36, 8, .45)); }
.pl-name.shake { animation: plShake .18s linear infinite; }
@keyframes plShake { 0% { transform: translate(0, 0); } 25% { transform: translate(2px, -1px); } 50% { transform: translate(-2px, 1px); } 75% { transform: translate(1px, 2px); } 100% { transform: translate(0, 0); } }
.pl-cloth { animation: plFade 1.2s ease both; }
.pl-j-ar { font: 700 40px/1 var(--f-ar); fill: #7a5a14; }
.pl-j-id { font: 600 28px/1 var(--f-text); fill: #6b4e10; letter-spacing: .04em; }
.pl-rays { animation: plSpin 24s linear infinite; }
@keyframes plSpin { to { transform: rotate(360deg); } }
.pl-jlight { animation: plGlow 2.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.pl-bob { animation: plBob 3.4s ease-in-out infinite; }
@keyframes plBob { 50% { transform: translateY(-2px); } }
.pl-blink { animation: plBlink 4.2s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes plBlink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.pl-flash { animation: plFlash 1.6s ease-out both; pointer-events: none; }
@keyframes plFlash { 0% { opacity: 0; } 25% { opacity: .55; } 100% { opacity: 0; } }
.pl-bubble-wrap { position: absolute; width: 0; height: 0; transition: left 1.6s ease, top 1.6s ease; pointer-events: none; }
.pl-bubble { position: absolute; bottom: 10px; left: 0; transform: translateX(-50%); width: max-content; max-width: min(460px, 70vw); box-sizing: border-box;
  padding: 10px 16px 12px; border-radius: 14px; background: #fbf6ea; color: #2a2118; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); animation: plPop .35s ease both; }
.pl-bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: #fbf6ea; }
.pl-bubble.notail::after { display: none; }
.pl-bubble.light { background: #fffbe8; box-shadow: 0 0 40px rgba(255, 230, 150, .65); }
.pl-bubble.light::after { border-top-color: #fffbe8; }
.pl-bubble.rasul { background: #fff4d6; }
.pl-bubble.rasul::after { border-top-color: #fff4d6; }
@keyframes plPop { from { opacity: 0; transform: translate(-50%, 8px) scale(.96); } }
.pl-who { margin: 0 0 2px; font: 600 12.5px/1.3 var(--f-ui); color: #8a6420; }
.pl-who span { font-weight: 500; color: #6d5a3a; }
.pl-ar { margin: 2px 0 4px; font: 26px/1.8 var(--f-quran); color: #3a2a12; text-align: right; }
.pl-txt { margin: 0; font: 17px/1.5 var(--f-text); }
.pl-caret { color: #b08a3a; }
.pl-count { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); margin: 0; padding: 4px 14px; border-radius: 99px; background: rgba(11, 20, 48, .8); border: 1px solid var(--line); font-size: 13px; color: var(--gold-soft); animation: plPop .4s ease both; }
.pl-babak { position: absolute; left: 20px; top: 16px; margin: 0; padding: 6px 14px; border-radius: 8px; background: rgba(11, 20, 48, .78); border: 1px solid var(--line); font: 600 16px/1.3 var(--f-text); color: var(--gold-soft); animation: plBabak 4s ease both; }
@keyframes plBabak { 0% { opacity: 0; transform: translateY(-6px); } 12%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.pl-end { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; background: rgba(6, 11, 32, .82); padding: 20px; animation: plFade .8s ease both; }
.pl-end h3 { margin: 0; font: 600 30px/1.2 var(--f-text); color: var(--gold-soft); }
.pl-end p { margin: 0 auto; max-width: 52ch; color: var(--ink); font: 16px/1.6 var(--f-text); }
.pl-end-btns { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
.pl-end-btns button, .pl-ctl button { height: 38px; min-width: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--lapis-2); cursor: pointer; font-size: 14px; }
.pl-end-btns button:first-child, .pl-ctl .play { background: var(--gold); color: var(--lapis-0); border-color: var(--gold); font-weight: 600; }
.pl-ctl button:disabled { opacity: .4; cursor: default; }
.pl-caption { min-height: 56px; }
.pl-narr { margin: 0; font: 18px/1.6 var(--f-text); color: var(--ink); max-width: 80ch; }
.pl-narr.dim { color: var(--muted); font-size: 15px; }
.pl-src { margin: 4px 0 0; font-size: 12.5px; color: var(--gold); }
.pl-src a { color: var(--gold-soft); text-underline-offset: 3px; text-decoration-color: var(--line); }
.pl-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pl-progress { flex: 1 1 360px; min-width: 0; display: flex; gap: 4px; }
.pl-progress .seg { position: relative; height: 30px; padding: 0 8px; min-width: 0; overflow: hidden; border-radius: 6px; background: var(--lapis-1); border: 1px solid var(--line); cursor: pointer; text-align: left; }
.pl-progress .seg i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(212, 174, 90, .35); transition: width .6s ease; }
.pl-progress .seg span { position: relative; display: block; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.pl-progress .seg.on { border-color: var(--gold); }
.pl-note { margin: 0; font-size: 11.5px; color: var(--muted); }

/* Cerita di peta */
.story-on .map-tools, .story-on .city-top, .story-on .city-foot, .story-on .walk-hud, .story-on .dpad { display: none !important; }
.story-on .map-labels .pin:not(.j-gunung) { opacity: 0; pointer-events: none; }
.st-root { position: absolute; inset: 0; pointer-events: none; }
.st-root > * { pointer-events: auto; }
.st-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none !important; }
.st-layer { z-index: 1; }
.st-root > .st-date, .st-root > .st-bottom { z-index: 2; }
.st-root > .st-end { z-index: 4; }
.st-node { position: absolute; left: 0; top: 0; width: 0; height: 0; visibility: hidden; }
.st-in { position: absolute; left: 0; bottom: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; transition: opacity 1.2s ease; }
.st-in.off { opacity: 0; }
.st-in .pl-bubble { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); }
@keyframes plPop { from { opacity: 0; transform: translate(-50%, 8px) scale(.96); } }
.st-rasul > p, .st-jibril > p { margin: 0; white-space: nowrap; text-align: center; line-height: 1.15; }
.st-bubble { white-space: normal; text-align: left; }
.st-wahyu { bottom: auto; top: 12px; left: 364px; right: 60px; transform: none; width: auto; max-width: 640px; margin: 0 auto; z-index: 3; white-space: normal; text-align: left; animation: plFade .6s ease; }
.st-wahyu::after { display: none; }
.st-rasul > .ar { font: 700 26px/1.2 var(--f-ar); color: #fff7d8; text-shadow: 0 0 12px rgba(255, 220, 140, .9), 0 1px 3px rgba(40, 24, 8, .7); }
.st-rasul > .id { font: 600 15px/1.2 var(--f-text); color: #fff1c4; text-shadow: 0 0 10px rgba(255, 220, 140, .8), 0 1px 3px rgba(40, 24, 8, .7); }
.st-rasul.gemetar > .ar, .st-rasul.gemetar > .id, .st-rasul.payah > .ar, .st-rasul.payah > .id { animation: plShake .18s linear infinite; }
.st-rasul.payah, .st-rasul.sakit { opacity: .75; }
.st-rasul.sujud > .ar, .st-rasul.sujud > .id { transform: translateY(16px) scale(.86); transition: transform .8s ease; }
.st-rasul.berselimut::after { content: ""; position: absolute; left: 50%; bottom: -22px; width: 150px; height: 34px; margin-left: -75px; border-radius: 18px 18px 8px 8px; background: #7a5a3a; border: 2px solid #5a4028; opacity: .95; z-index: -1; }
.st-jibril { bottom: auto; top: 26px; }
.st-jibril .pl-bubble { bottom: calc(100% + 70px); }
.st-jibril > .ar { font: 700 30px/1.2 var(--f-ar); color: #fffbe8; text-shadow: 0 0 16px #ffe7a0, 0 0 4px #b08a2a; }
.st-jibril > .id { font: 600 16px/1.2 var(--f-text); color: #fff6d0; text-shadow: 0 0 12px #ffe7a0, 0 1px 3px rgba(60, 40, 0, .8); }
.st-jibril > .ar, .st-jibril > .id { color: #2e2408; text-shadow: 0 0 8px #fff6d0, 0 0 2px #fff; }
.st-jibril.off { opacity: 0; }
.st-char { transform: translateX(-50%) scale(var(--s, 1)); transform-origin: 50% 100%; }
.st-char .pl-bubble { transform: translateX(-50%) scale(calc(1 / var(--s, 1))); transform-origin: 50% 100%; }
.st-chibi { width: 80px; height: 131px; overflow: visible; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .5)); }
.st-cname { margin: 2px 0 0; padding: 1px 8px; border-radius: 99px; background: rgba(11, 20, 48, .8); font-size: 11.5px; color: var(--ink); white-space: nowrap; }
.st-date { position: absolute; left: 12px; top: 12px; width: min(340px, calc(100% - 80px)); box-sizing: border-box; padding: 10px 14px; border-radius: 12px; background: rgba(11, 20, 48, .86); border: 1px solid var(--line); transition: box-shadow .6s ease; max-height: calc(100% - 230px); overflow: auto; }
.st-date.hl { box-shadow: 0 0 0 2px var(--gold), 0 0 26px rgba(212, 174, 90, .45); }
.st-date h3 { margin: 0; font: 600 17px/1.25 var(--f-text); color: var(--gold-soft); }
.st-date .st-k { margin: 0; font-size: 11.5px; color: var(--muted); }
.st-date .st-when { margin: 4px 0 2px; font-weight: 600; color: var(--ink); font-size: 13.5px; }
.st-date dl { margin: 8px 0 0; display: flex; flex-direction: column; gap: 8px; }
.st-date dt { font-weight: 600; font-size: 12px; color: var(--gold); }
.st-date dd { margin: 0; font-size: 12.5px; color: var(--ink); line-height: 1.45; }
.st-date dd .src a { color: var(--gold-soft); }
.st-close { position: absolute !important; top: 12px; right: 12px; }
.st-babak { left: 50% !important; transform: translateX(-50%); top: 14px !important; }
.st-flash { position: absolute; inset: 0; background: #fff8e0; pointer-events: none !important; animation: plFlash 1.6s ease-out both; }
.st-end { z-index: 5; }
/* Adegan dalam ruangan di atas peta */
.in-wrap { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; box-sizing: border-box; padding: 84px 12px 190px;
